name: Test and publish image
# Every branch push publishes an immutable sha-<commit> tag; deployments pin the
# digest, so a pre-merge branch build is as deployable as a main build.
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Public repo: the org's self-hosted runner groups refuse public repos, so
    # this runs on GitHub-hosted runners (no minutes charge for public repos).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/seankoji-com/proxy-commandcode:sha-${{ github.sha }}
          cache-from: type=gha,scope=proxy-commandcode
          cache-to: type=gha,scope=proxy-commandcode,mode=max
      - if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Deploy ghcr.io/seankoji-com/proxy-commandcode@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
